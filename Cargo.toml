[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["std", "flex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tempfile = "3"
assort-core = { path = "crates/assort-core" }
assort-tokenizer = { path = "crates/assort-tokenizer" }
assort-data = { path = "crates/assort-data" }
assort-model = { path = "crates/assort-model" }
assort-inference = { path = "crates/assort-inference" }
assort-training = { path = "crates/assort-training" }
assort-transcript = { path = "crates/assort-transcript" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
debug = 1

[profile.test]
debug = 1
